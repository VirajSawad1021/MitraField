# Builds the image with layer caching (the TeX Live and Chromium layers take ~15 minutes cold).
# Used by deploy/deploy.sh:  gcloud builds submit --config deploy/cloudbuild.yaml --substitutions=_IMAGE=...
steps:
  - id: pull-cache
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: ["-c", "docker pull ${_REPO_IMAGE}:cache || true"]
  - id: build
    name: gcr.io/cloud-builders/docker
    env: ["DOCKER_BUILDKIT=1"]
    args: ["build", "--build-arg", "BUILDKIT_INLINE_CACHE=1", "--cache-from", "${_REPO_IMAGE}:cache",
           "-t", "${_IMAGE}", "-t", "${_REPO_IMAGE}:cache", "."]
  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_REPO_IMAGE}"]
images: []
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
timeout: 3000s
