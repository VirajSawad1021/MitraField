name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]   # main is built and tested by the deploy workflow, which calls this one
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tests, Firestore emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: System libraries for Manim and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libcairo2-dev libpango1.0-dev pkg-config
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Tests (the Firestore tests run against the emulator)
        run: npx --yes firebase-tools@15.34.0 emulators:exec --only firestore --project demo-mitrafield "python -m pytest tests -q"

  web:
    name: Web (lint, type-check, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: NODE_ENV=production npx next build

  scripts:
    name: Deploy scripts and workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo apt-get install -y shellcheck
      - run: shellcheck -S warning deploy/*.sh
      - run: bash -n deploy/deploy.sh && bash -n deploy/bootstrap.sh
      - name: Workflow syntax
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7 && ./actionlint

  image:
    name: Container image builds
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          load: true
          tags: mitrafield:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image contract (non-root, tools present, app imports, sandbox probe)
        run: |
          docker run --rm --entrypoint sh mitrafield:ci -c '
            test "$(id -u)" = 10001 &&
            ffmpeg -version >/dev/null && manim --version >/dev/null && python -c "import playwright" &&
            ls /ms-playwright | grep -q chromium &&
            STUDIO_DATA=/tmp/d python -c "import backend.app, backend.sandbox as s; print(\"net_isolated\", s.NET_ISOLATED)"'
